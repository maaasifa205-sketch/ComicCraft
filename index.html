<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComicCraft</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #2c3e50;
            color: #fff;
            padding: 1rem 2rem;
            text-align: center;
        }
        main {
            flex: 1;
            padding: 2rem;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }
        .hero {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .hero h2 {
            margin-bottom: 1rem;
            color: #2c3e50;
        }
        .btn {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.75rem 1.5rem;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        footer {
            text-align: center;
            padding: 1rem;
            background-color: #ecf0f1;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <header>
        <h1>ComicCraft</h1>
    </header>

    <main>
        <section class="hero">
            <h2>Welcome to ComicCraft</h2>
            <p>Create, manage, and design your comic projects easily.</p>
            <a href="#" class="btn">Get Started</a>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ComicCraft. All rights reserved.</p>
    </footer>

</body>
</html>
